name: Verify recorded case study

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Recompute results without installed packages
        run: python -I -S scripts/reproduce_case_study.py
      - name: Verify QASPER extension and reproduce official Answer F1
        run: |
          cd release/qasper-agent-study
          sha256sum --check SHA256SUMS
          cd ../..
          python -I -S benchmarks/envoybench/qasper_official.py score --run-dir release/envoybench-v0.1/run --output "$RUNNER_TEMP/qwen-score.json"
          cmp "$RUNNER_TEMP/qwen-score.json" release/qasper-agent-study/qwen-official-score.json
          python -I -S benchmarks/envoybench/qasper_official.py score --run-dir release/qasper-agent-study/nebius-amended-run --output "$RUNNER_TEMP/nemotron-score.json"
          cmp "$RUNNER_TEMP/nemotron-score.json" release/qasper-agent-study/nemotron-official-score.json
          python -I -S - <<'PY'
          import json
          from pathlib import Path
          root = Path('release/qasper-agent-study')
          def load(relative):
              return json.loads((root / relative).read_text())
          original = load('nebius-run/manifest.json')
          original_rows = load('nebius-run/results.partial.json')
          original_usage = load('nebius-run/usage-budget.json')
          continuation = load('nebius-continuation/results.json')
          amended = load('nebius-amended-run/manifest.json')
          amended_rows = load('nebius-amended-run/results.json')
          amended_usage = load('nebius-amended-run/usage-budget.json')
          assert original['status'] == 'incomplete'
          assert not (root / 'nebius-run/results.json').exists()
          assert len(original_rows) == 39 and len(original['question_ids']) == 40
          assert original_rows[-1]['error'] == 'RuntimeError: estimated inference cost budget exhausted'
          assert original_usage['estimated_usd'] <= original_usage['config']['max_estimated_usd'] == 2
          assert amended['status'] == 'complete'
          assert len(amended_rows) == 40 and len(continuation) == 2
          assert [row['question_id'] for row in amended_rows] == amended['question_ids']
          for combined, source in zip(amended_rows, original_rows[:38] + continuation):
              assert {k: v for k, v in combined.items() if k not in ('run_id', 'comparison_id')} == {
                  k: v for k, v in source.items() if k not in ('run_id', 'comparison_id')
              }
          assert amended_rows[38]['status'] == 'no_submission'
          assert amended_rows[39]['status'] == 'submitted'
          assert amended_usage['config']['max_estimated_usd'] == 25
          assert amended_usage['estimated_usd'] == 2.035422
          print('Original partial run preserved; amended 40-row lineage and score verified.')
          PY
      - name: Verify archived training records and data bindings
        run: |
          cd release/qwen-v5-training
          sha256sum --check SHA256SUMS
          cd ../..
          python -I -S - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('release/qwen-v5-training/run-manifest.json').read_text())
          for key in ('data', 'validation', 'corpus_manifest'):
              record = manifest[key]
              actual = hashlib.sha256(Path(record['path']).read_bytes()).hexdigest()
              assert actual == record['sha256'], f'{key}: training input changed'
          print('Three original training input hashes match.')
          PY
      - name: Install test runner only
        run: python -m pip install 'pytest>=8,<9'
      - name: Test corruption and review-binding checks
        run: python -m pytest tests/test_reproduce_case_study.py tests/test_qasper_official.py -q
