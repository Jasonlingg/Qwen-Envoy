name: Verify recorded case study

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Recompute results without installed packages
        run: python -I -S scripts/reproduce_case_study.py
      - name: Verify QASPER extension and reproduce official Answer F1
        run: |
          cd release/qasper-agent-study
          sha256sum --check SHA256SUMS
          cd ../..
          python -I -S benchmarks/envoybench/qasper_official.py score --run-dir release/envoybench-v0.1/run --output "$RUNNER_TEMP/qwen-score.json"
          cmp "$RUNNER_TEMP/qwen-score.json" release/qasper-agent-study/qwen-official-score.json
          python -I -S - <<'PY'
          import json
          from pathlib import Path
          run = Path('release/qasper-agent-study/nebius-run')
          manifest = json.loads((run / 'manifest.json').read_text())
          rows = json.loads((run / 'results.partial.json').read_text())
          usage = json.loads((run / 'usage-budget.json').read_text())
          assert manifest['status'] == 'incomplete'
          assert not (run / 'results.json').exists()
          assert len(rows) == 39 and len(manifest['question_ids']) == 40
          assert rows[-1]['error'] == 'RuntimeError: estimated inference cost budget exhausted'
          assert usage['estimated_usd'] <= usage['config']['max_estimated_usd'] == 2
          print('Bounded hosted attempt remains explicitly incomplete; no full-run F1 claimed.')
          PY
      - name: Verify archived training records and data bindings
        run: |
          cd release/qwen-v5-training
          sha256sum --check SHA256SUMS
          cd ../..
          python -I -S - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('release/qwen-v5-training/run-manifest.json').read_text())
          for key in ('data', 'validation', 'corpus_manifest'):
              record = manifest[key]
              actual = hashlib.sha256(Path(record['path']).read_bytes()).hexdigest()
              assert actual == record['sha256'], f'{key}: training input changed'
          print('Three original training input hashes match.')
          PY
      - name: Install test runner only
        run: python -m pip install 'pytest>=8,<9'
      - name: Test corruption and review-binding checks
        run: python -m pytest tests/test_reproduce_case_study.py tests/test_qasper_official.py -q
