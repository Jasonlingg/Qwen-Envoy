name: Publish saved Studio

on:
  push:
    branches: [main]
    paths:
      - 'release/envoybench-v0.1/**'
      - 'release/qasper-agent-study/**'
      - 'release/hackathon-research-mcp/**'
      - 'scripts/reproduce_case_study.py'
      - '.github/workflows/studio-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify the frozen comparison before publishing
        run: python -I -S scripts/reproduce_case_study.py
      - name: Verify the QASPER extension
        working-directory: release/qasper-agent-study
        run: sha256sum --check SHA256SUMS
      - uses: actions/configure-pages@v5
      - name: Stage only the read-only viewer
        run: |
          mkdir -p _site
          cp release/qasper-agent-study/studio.html _site/index.html
          mkdir -p _site/research-mcp
          cp release/hackathon-research-mcp/index.html release/hackathon-research-mcp/demo.json _site/research-mcp/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy saved-run viewer
        id: deployment
        uses: actions/deploy-pages@v4
