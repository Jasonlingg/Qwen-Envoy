[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envoy-reader"
version = "0.1.0"
description = "Frozen Qwen Envoy Docker reader compatibility taskset for Verifiers"
requires-python = ">=3.11"
dependencies = ["verifiers==0.4.0"]

[tool.setuptools.packages.find]
where = ["src"]
